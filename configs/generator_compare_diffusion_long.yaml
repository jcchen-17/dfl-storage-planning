seed: 7

data:
  dataset_path: data/processed/ieee13_smartds_dfl/dfl_training_windows_48h_price_regimes.npz
  train_split: train
  validation_split: validation
  test_split: test
  horizon: 48
  delta_t_hours: 1.0

# Shared generator training settings, named `cvae` for backward compatibility.
# The GAN and the diffusion model read the same latent size, width, epoch count,
# batch size and field weights, so the three differ only in training objective.
cvae:
  latent_dim: 64
  hidden_dim: 512
  epochs: 1500
  learning_rate: 0.001
  beta: 0.002
  ramp_weight: 0.05
  batch_size: 64
  kl_warmup_epochs: 50
  active_load_weight: 0.20
  reactive_load_weight: 0.10
  pv_weight: 0.20
  workload_weight: 0.10
  pue_weight: 0.05
  price_weight: 0.25
  carbon_weight: 0.10
  net_load_weight: 0.15
  net_peak_weight: 0.20
  price_spread_weight: 0.20

generator:
  # cvae | gan | diffusion. Override per run with `--generator` instead of
  # editing this, so one output directory can hold all three comparisons.
  kind: cvae
  gan:
    critic_steps: 5
    gradient_penalty: 10.0
    critic_hidden_dim: 512
    critic_learning_rate: 0.0002
    generator_learning_rate: 0.0002
    # A GAN sample has no paired observation, so peak net load and price spread
    # are matched as batch moments rather than per scenario.
    moment_weight: 10.0
    encoder_epochs: 200
    encoder_learning_rate: 0.001
    latent_prior_weight: 0.01
  diffusion:
    timesteps: 400
    sampling_steps: 50
    beta_schedule: cosine
    # `projected` confines the DDIM initial noise to a 64-dimensional subspace so
    # the REINFORCE policy can search it. `full` gives the unrestricted 5,808-
    # dimensional noise and can only be used for generative-quality comparison.
    latent_mode: projected
    blocks: 3
    x_zero_clamp: 5.0
    physics_weight: 0.1

dfl:
  method: reinforce
  # REINFORCE learns one representative 48 h latent scenario. Its weight is
  # fixed at 1.0 and its design is ranked on a fixed representative validation set.
  num_support_scenarios: 1
  epochs: 12
  validation_batch_size: 6
  final_validation_size: 6
  learning_rate: 0.01
  baseline_momentum: 0.75
  initial_exploration_std: 0.30
  minimum_exploration_std: 0.08
  exploration_decay: 0.90
  diversity_margin: 0.80
  diversity_weight: 0.05
  weight_entropy_weight: 0.005
  policy_samples_per_epoch: 3
  latent_prior_weight: 0.001
  candidate_pool_size: 12
  bo_initial_evaluations: 6
  bo_iterations: 6
  bo_parameter_bound: 3.0
  bo_candidate_draws: 512
  bo_kernel_length_scale: 1.0
  bo_exploration: 1.5
  bo_weight_floor: 0.02
  bo_finalists: 2
  decision_deadband_relative: 0.005
  device: auto

planning:
  max_storage_sites: 1
  initial_soc: 0.20
  initial_carbon_intensity: 0.28
  min_soc: 0.10
  max_soc: 0.90
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  # A positive value can conflict with simultaneous hard terminal energy and
  # carbon cycles when no charging source matches the initial inventory CI.
  self_discharge: 0.0
  min_power_mw: 0.05
  max_power_mw: 1.20
  min_energy_mwh: 0.10
  max_energy_mwh: 3.00
  min_duration_hours: 1.0
  max_duration_hours: 4.0
  grid_limit_mw: 5.0
  carbon_intensity_max: 1.20
  dc_carbon_cap: 0.62
  other_bus_carbon_cap: 1.10
  # Keep charging-hour carbon vintages in the 48 h planning and DFL solves.
  # McCormick envelopes retain the layered formulation without the nonconvex
  # bilinear equalities used by the exact verification model.
  carbon_formulation: mccormick
  flow_limit_formulation: polygon
  solver_time_limit_seconds: 300
  solver_relative_gap: 0.005
  solver_threads: 4
  verbose_solver: false
  # Budget for the no-storage bootstrap that seeds each solve; 0 selects
  # max(60 s, 30% of solver_time_limit_seconds) = 90 s here. The bootstrap is
  # cached per scenario set, so the fixed validation set pays it once for the
  # whole run and only the per-sample planning solves pay it repeatedly. Lower
  # this first if the bootstrap dominates wall-clock time.
  warm_start_time_limit_seconds: 0.0

costs:
  # Calibrated commercial-microgrid case. These costs remain below a current
  # turnkey benchmark so storage can still be selected, but they remove the
  # unrealistically cheap $58/kWh four-hour system used by the strong-storage
  # sensitivity case.
  capital_recovery_factor: 0.10
  site_dollars: 25000.0
  power_dollars_per_mw: 150000.0
  energy_dollars_per_mwh: 150000.0
  degradation_dollars_per_mwh: 8.0
  demand_dollars_per_mw_year: 150000.0
  generator_dollars_per_mwh: 250.0
  delay_dollars_per_task_hour: 8.0
  curtailment_dollars_per_mwh: 4.0
  shedding_dollars_per_mwh: 10000.0
  validation_carbon_slack_dollars: 100000.0

# Isolated from the calibrated run so retraining the generators cannot overwrite
# its cvae.pt, normalization.json or DFL checkpoints.
output_dir: outputs/generator_comparison_diffusion_long_48h


