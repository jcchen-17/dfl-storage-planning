# K=3, T2 storage-economics sensitivity.
#
# This keeps the K3T1 network, three-times data-center load, existing 2 MW
# backup generator, storage bounds and carbon constraints unchanged. T2 only
# tests a plausible low-cost BESS / high-demand-charge commercial case; storage
# remains optional and is never forced into the solution.
seed: 0

data:
  # The un-augmented windows, not the _price_regimes expansion.
  #
  # augment_price_regimes.py multiplies each window into five tariff regimes by
  # scaling the price spread around its own mean, and appends the factor as a
  # fifth context dimension. Both parts caused problems. The factor is a label,
  # not an observation, and the REINFORCE policy optimises only the latent while
  # the context stays fixed at the seed scenario's -- so the seed's price regime
  # is frozen for the whole run, and with a 1.0x seed the largest price spread
  # any latent can reach is 13.57 $/MWh against the 87-139 that good supports
  # have. And the spread was the entire source of storage value: on the
  # un-augmented windows the perfect-information ceiling is 0, i.e. every
  # storage_value ever recorded here came from the synthetic multiplier.
  #
  # Storage now earns its value against the carbon target instead (see
  # dc_carbon_cap and carbon_price_dollars_per_t), which is measured rather than
  # manufactured. Uncertainty comes from load, PV, workload and grid carbon
  # intensity, all of them real: the carbon intensity swings 0.0911 tCO2/MWh
  # within a window on average, 35% of its own mean.
  #
  # Context is 4-dimensional here against 5 in the expansion, so a generator
  # trained on the old path cannot be reused -- retrain before evaluating.
  dataset_path: data/processed/ieee13_smartds_dfl/dfl_training_windows_48h.npz
  train_split: train
  validation_split: validation
  test_split: test
  horizon: 48
  delta_t_hours: 1.0

# Shared generator training settings, named `cvae` for backward compatibility.
# The GAN and the diffusion model read the same latent size, width, epoch count,
# batch size and field weights, so the three differ only in training objective.
cvae:
  latent_dim: 64
  hidden_dim: 512
  epochs: 250
  learning_rate: 0.001
  beta: 0.002
  ramp_weight: 0.05
  batch_size: 64
  kl_warmup_epochs: 50
  active_load_weight: 0.20
  reactive_load_weight: 0.10
  pv_weight: 0.20
  workload_weight: 0.10
  pue_weight: 0.05
  price_weight: 0.25
  carbon_weight: 0.10
  net_load_weight: 0.15
  net_peak_weight: 0.20
  price_spread_weight: 0.20

generator:
  # cvae | gan | diffusion. Override per run with `--generator` instead of
  # editing this, so one output directory can hold all three comparisons.
  kind: cvae
  gan:
    critic_steps: 5
    gradient_penalty: 10.0
    critic_hidden_dim: 512
    critic_learning_rate: 0.0002
    generator_learning_rate: 0.0002
    # A GAN sample has no paired observation, so peak net load and price spread
    # are matched as batch moments rather than per scenario.
    moment_weight: 10.0
    encoder_epochs: 200
    encoder_learning_rate: 0.001
    latent_prior_weight: 0.01
  diffusion:
    timesteps: 400
    sampling_steps: 50
    beta_schedule: cosine
    # `projected` confines the DDIM initial noise to a 64-dimensional subspace so
    # the REINFORCE policy can search it. `full` gives the unrestricted 5,808-
    # dimensional noise and can only be used for generative-quality comparison.
    latent_mode: projected
    blocks: 3
    x_zero_clamp: 5.0
    physics_weight: 0.1

dfl:
  method: reinforce
  # REINFORCE learns this many representative 48 h latent scenarios and their
  # weights; every candidate design is ranked on a fixed validation set. The
  # conditioning contexts are farthest-point anchors over
  # [day-of-year, weekend, temperature, price regime], so they spread across the
  # year on their own. At K=3 that spread was summer plus two winter days, with
  # spring and autumn uncovered; K=5 was the first count reaching all four
  # seasons. Nothing here encodes an extreme or emergency day: the context has no
  # such dimension, and decision-relevant extremes enter through the validation
  # set instead (ScenarioCodec.support_indices). The planning model grows
  # linearly in K, so this is also the main lever on solve time.
  num_support_scenarios: 1
  epochs: 50
  # These two are priced very differently and should not move together.
  # validation_batch_size is solved once per sample, so 8 x 50 = 400 times, and
  # those solves run concurrently across solver_max_parallel_workers. The model
  # is linear in the scenario count -- 397k variables at 6, 1.06M at 16, 2.12M
  # at 32 -- so at 32 there would be eight 2.12M-variable models in flight
  # against a 3500 MB per-solve budget, and the barrier factor alone was 600 MB
  # at 589k. Every validation solve would stop on memlimit, which is worse than
  # the sampling noise it was raised to fix: the decision loss would then rank
  # incumbents nobody proved anything about.
  validation_batch_size: 16
  # final_validation_size is the reported number and runs serially, two or three
  # times a whole run, so one large model is affordable where eight are not.
  # Worth enlarging on its own evidence: at 6 scenarios the cost-versus-size
  # curve came out monotonically decreasing, at 16 it turned into a U with an
  # interior minimum, and a ranking that reverses when the evaluation set grows
  # is not yet a ranking. Raise until it stops moving.
  final_validation_size: 16
  # Adam's step size is the per-epoch displacement of the policy mean, so this
  # times `epochs` bounds how far the mean can travel in a whole run. At 0.01 the
  # bound is 0.15 and realised travel is nearer 0.036, against a latent
  # initialised at scale 0.28 and sampled with exploration_std 0.80 -> 0.15: the
  # mean never leaves the cloud it is drawing from, and no number of epochs
  # fixes that, since travel grows only as sqrt(epochs). Raising the step is the
  # cheap lever. Not raised further: past ~0.05 the random component of the
  # score-function estimator grows faster than the signal.
  learning_rate: 0.03
  baseline_momentum: 0.75
  initial_exploration_std: 0.80
  # Keep broad exploration early, then allow a quieter fine-tuning phase. The
  # previous 0.92 schedule hit its 0.15 floor at epoch 21 and therefore injected
  # the same visible sampling noise throughout the second half of training.
  minimum_exploration_std: 0.10
  exploration_decay: 0.94
  diversity_margin: 0.80
  diversity_weight: 0.05
  weight_entropy_weight: 0.005
  # Search width of one epoch. The policy perturbs a K x latent_dim = 512-
  # dimensional point, so a handful of probes is close to a random line search;
  # eight also keeps the chance low of an epoch where every sample yields the
  # same design, which zeroes the decision gradient outright. Keep it a multiple
  # of solver_max_parallel_workers, or the last wave of solves runs part-empty.
  # Equal to the workers here, so one full wave.
  policy_samples_per_epoch: 8
  latent_prior_weight: 0.001
  candidate_pool_size: 12
  bo_initial_evaluations: 6
  bo_iterations: 6
  bo_parameter_bound: 3.0
  bo_candidate_draws: 512
  bo_kernel_length_scale: 1.0
  bo_exploration: 1.5
  bo_weight_floor: 0.02
  bo_finalists: 2
  # Keep several engineering-distinct REINFORCE designs and compare all of
  # them once on the same final validation set. This is model selection on the
  # validation split only; the test split remains sealed until evaluate.py.
  reinforce_finalists: 4
  # Match the requested MIP gap. Differences smaller than this are not reliably
  # ordered by the solver and must be ties, otherwise REINFORCE learns numerical
  # noise. The finalist tie-break then prefers the cheaper/smaller design.
  decision_deadband_relative: 0.001
  # Stop only after the decision loss has failed to improve by more than the
  # solver-resolution deadband for ten epochs. This is decision convergence,
  # not the visual flatness of a noisy REINFORCE curve.
  early_stopping_min_epochs: 50
  early_stopping_patience: 10
  device: auto

data_center:
  # Facility power = non_it_mw + PUE * (it_base_mw + it_workload_mw * processed).
  # Three times the original edge-scale coefficients: 0.44-1.45 MW peak, about
  # 42% of feeder load, a small enterprise data center. Hosting it requires the
  # 671-692-675 branch uprated to 4.0 MVA; the original 2.5 MVA rating was
  # already marginal for the 0.48 MW facility.
  # These coefficients affect planning only. The dataset carries dimensionless
  # workload and PUE series, so rescaling here never invalidates a trained
  # generator.
  non_it_mw: 0.09
  it_base_mw: 0.36
  it_workload_mw: 0.90

planning:
  max_storage_sites: 1
  initial_soc: 0.20
  initial_carbon_intensity: 0.28
  min_soc: 0.10
  max_soc: 0.90
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  # A positive value can conflict with simultaneous hard terminal energy and
  # carbon cycles when no charging source matches the initial inventory CI.
  self_discharge: 0.0
  min_power_mw: 0.05
  # Relaxed for the 3x data center. The previous solution sat at 92% of a 4.0 h
  # duration cap, so the cap would have bound and set the design instead of the
  # economics. Report whether the optimum stays interior.
  max_power_mw: 1.5
  min_energy_mwh: 0.10
  max_energy_mwh: 5.00
  min_duration_hours: 1.0
  max_duration_hours: 4.0
  grid_limit_mw: 5.0
  # Backup generator, sized against the facility it backs up.
  backup_generator_mw: 2.0
  backup_generator_mvar: 1.6
  # Upper bound for every carbon-intensity variable, and therefore the bound the
  # McCormick envelopes are built on. It must cover the dirtiest source that can
  # end up inside storage: the backup generator at 0.72 tCO2/MWh (the grid peaks
  # at 0.409 on this dataset). Setting it below 0.72 would cut off legal
  # dispatches; 0.75 is the floor with a margin.
  #
  # Was 1.20, which is 60% above anything physical, and that slack propagated
  # straight into a weak LP bound. Measured on the 16-scenario evaluation set at
  # dc_carbon_cap 0.30:
  #   1.20 -> gap 1.25e-03, 922 s, stopped on the time limit, value 5,089
  #   0.75 -> gap 9.91e-04, 259 s, optimal,                    value 3,403
  # so the old run was both unconverged and 50% high. At a non-binding cap both
  # settings return the identical solution, which is what shows 0.75 cuts off
  # nothing.
  carbon_intensity_max: 0.75
  # The carbon target the facility is held to, in tCO2/MWh of delivered power.
  # Measured storage value on the 16-scenario evaluation set, all converged:
  #   0.62 ->      0   installs nothing; the cap never binds (grid peaks at 0.409)
  #   0.30 ->  3,403   0.367 MW / 1.449 MWh, carbon cost cut 37%
  #   0.26 ->  5,278   1.692 MWh
  # A tighter target does NOT raise the value -- it raises the carbon bill on
  # both sides of the comparison, so the difference shrinks -- but it does widen
  # the gap between scenarios, which is what the selection problem needs. K=1
  # headroom probe, ten random draws plus the three deterministic rules:
  #   cap    mean     sd   sd/mean   worst    best   rules below zero
  #   0.26  3,680    663      18%    2,222   4,584   0
  #   0.22  2,961    855      29%      862   3,948   0
  #   0.18    400    850     213%   -1,491   1,400   4
  # 0.22 balances the two. At 0.26 random selection is reliable enough (18%)
  # that a learned selector has little left to improve. At 0.18 the mean
  # collapses and storage stops being reliably worth building at all, which is
  # the degenerate regime this whole setup exists to escape -- its 213% spread
  # is an artifact of a near-zero mean, not a usable signal, and reading sd/mean
  # without also requiring a comfortably positive mean would have hidden that.
  dc_carbon_cap: 0.22
  other_bus_carbon_cap: 1.10
  # system_average, not mccormick. The per-bus formulation applies the cap to
  # nodal_carbon, which McCormick bounds only as
  # incoming_carbon / incoming_power_upper; the envelope's lower bound goes
  # negative whenever a flow sits below its own bound, so a line may carry zero
  # carbon and any cap is satisfiable. Measured: with mccormick the objective is
  # bit-identical at every cap from 0.62 down to 0.05, i.e. the carbon target
  # never affected a single decision. Three rounds of tightening the envelope
  # bounds did not change that -- it is structural, not a tuning problem.
  #
  # system_average applies the cap to the system intensity, which is linear and
  # needs no envelope, so it binds exactly. Storage carbon vintages are still
  # tracked (aggregate_discharge_carbon enters system_carbon), so the layered
  # accounting this project is about is retained; only the level at which the
  # target is imposed changes. At a non-binding cap both formulations return the
  # same objective, which is what makes the switch safe.
  carbon_formulation: system_average
  flow_limit_formulation: polygon
  # A solve that stops on the time limit never reaches solver_relative_gap,
  # which puts the ranking back inside solver noise and defeats the point of
  # tightening the gap at all. Headroom rather than a target: the model grows
  # linearly in K (589k variables at K=9 against 327k at K=5) and a planning
  # solve was measured at 291 s, so this binds only if something goes wrong.
  solver_time_limit_seconds: 1800
  # Which solver builds and solves the planning problem: scip | gurobi.
  # The production formulation is a pure MILP, where the gap between solvers is
  # widest. Gurobi needs gurobipy plus a license large enough for this model.
  solver_backend: gurobi
  # Sized against the differences actually being ranked. At 0.005 the tolerance
  # left 7,650 of the objective unresolved while a whole 15-epoch run varied by
  # 1,154: the ordering carried solver noise, and the policy travelled at 0.97x
  # a pure random walk. 0.0005 resolved that but overshot. The signal is 13,040
  # (0.845%) between installing storage and not, and 4,490 (0.29%) among the
  # designs that do install; 0.001 leaves a floor of 1,530, which is 8.5x and
  # 2.9x those. Precision below that is unused and expensive -- a solve reaches
  # 0.20% at 90 s and then spends ~200 s in the root cut loop to reach 0.05%.
  solver_relative_gap: 0.001
  # Two, measured by scripts/tune_solver.py on the training machine (i7-14650HX,
  # 16 physical / 24 logical, 32 GB) on the K=1 planning solve:
  #   2 threads 4.3 s | 4 threads 4.1 s | 8 threads 5.3 s | 16 threads 4.1 s
  # 2, 4 and 16 are within noise of each other and 8 is worse, which is what a
  # P-core/E-core split does to a fixed thread count. Two is as fast per solve as
  # any of them and leaves the rest of the machine for concurrent solves, which
  # is where the throughput actually is.
  #
  # Do not carry this number to another machine. On a 6-core / 12-thread desktop
  # the same measurement gave 1 thread 18.37 s | 2 threads 14.06 s | 4 threads
  # 7.27 s | 6 threads 7.43 s, where four is nearly twice two. Run tune_solver.py
  # instead of assuming.
  solver_threads: 2
  # Search strategy. These reorder SCIP's search without changing the model, so
  # a solution found this way is exactly as valid; only the effort spent proving
  # optimality shifts. Decision-focused training ranks samples by their incumbent
  # objective, so reaching a good primal solution quickly is what matters.
  solver_emphasis: feasibility
  solver_aggressive_heuristics: true
  # Samples within one DFL epoch are independent and each already solves in its
  # own process, so this is the main lever on wall-clock time.
  # Eight, from tune_solver.py on the training machine. The solve that runs
  # concurrently is the fixed-design validation solve over
  # validation_batch_size scenarios; measured peak RSS for one of those is
  # 955 MB there. Against 18.3 GB free and 24 logical processors:
  #   memory -> 15 workers (16.3 GB usable at 1,099 MB each with headroom)
  #   cores  -> 12 workers (24 logical at solver_threads 2)
  #   waves  ->  8, the largest divisor of policy_samples_per_epoch, so an
  #              epoch's solves fit whole waves instead of leaving one part-empty
  # Memory is comfortable here, which it was not before: the same solve peaked
  # at 2,885 MB under carbon_formulation "mccormick", and moving to
  # system_average cut the model to a third of the size.
  #
  # This is machine-specific and the failure is asymmetric. On a 6-core / 16 GB
  # desktop the same eight workers wanted 22.5 GB against 5.1 GB free and paged,
  # which cost more than running a third as many would have. Re-measure rather
  # than carry it.
  solver_max_parallel_workers: 8
  # Per-solve budget. Concurrency multiplies it, so keep
  # workers x memory below usable RAM. Exceeding it yields a 'memorylimit'
  # status with the incumbent kept, rather than an aborted process.
  # Measured, not estimated. Peak RSS of one worker process on the training
  # machine under carbon_formulation system_average:
  #   validation, 16 scenarios, fixed design : 955 MB  <- the concurrent one
  # 1,000 leaves headroom over that, and 8 x 1,000 = 8 GB against 18.3 GB free.
  #
  # The same solve peaked at 2,885 MB under "mccormick", and a free-design solve
  # over 16 scenarios peaked at 4,093 MB there -- enough to overrun the old 3,500
  # and return memlimit with no other worker running. Both shrank by roughly a
  # third when the carbon formulation changed.
  #
  # The value this replaced was "8 x 3500 = 28 GB of a 32 GB machine", labelled
  # "Estimated, not measured". The arithmetic was right for that machine and the
  # estimate was three times the truth. A free-design solve over many scenarios
  # (the K=8 sweep rows, or the perfect-information solve) still wants more, and
  # should be run at workers 1 rather than by raising this for everything.
  solver_memory_limit_mb: 1000
  # Note this shows nothing during a DFL run: planning solves happen in isolated
  # workers whose stdout _run_worker captures and discards unless they fail. Use
  # scripts/solver_log_probe.py to see a solver log; it stays in-process.
  verbose_solver: true
  # Budget for the no-storage bootstrap that seeds each solve; 0 selects
  # max(60 s, 30% of solver_time_limit_seconds) = 90 s here. The bootstrap is
  # cached per scenario set, so the fixed validation set pays it once for the
  # whole run and only the per-sample planning solves pay it repeatedly. Lower
  # this first if the bootstrap dominates wall-clock time.

  warm_start_time_limit_seconds: 300


costs:
  # T2: midpoint storage-economics sensitivity between K3T1 (storage was often
  # rejected) and the former aggressive T2 values (storage hit both capacity
  # bounds). For a 4 h system the variable CAPEX is 140 $/kW + 4*135 $/kWh =
  # 680 $/kW, and its annualized variable cost is 61.2 $/kW-year. Storage stays
  # optional; neither installation nor a minimum aggregate capacity is imposed.
  capital_recovery_factor: 0.09
  site_dollars: 20000.0
  power_dollars_per_mw: 140000.0
  energy_dollars_per_mwh: 135000.0
  degradation_dollars_per_mwh: 7.0
  demand_dollars_per_mw_year: 160000.0
  generator_dollars_per_mwh: 250.0
  delay_dollars_per_task_hour: 24.0
  curtailment_dollars_per_mwh: 4.0
  shedding_dollars_per_mwh: 10000.0
  # Superseded by carbon_price_dollars_per_t below, which takes precedence
  # whenever it is positive. Kept so runs that predate the priced formulation
  # still load and reproduce.
  validation_carbon_slack_dollars: 300000.0
  # Price on carbon emitted beyond dc_carbon_cap, in dollars per tonne. This is
  # the US social cost of carbon; traded credits would put it at 50-100 instead,
  # and the choice is worth stating in the paper because the storage value scales
  # with it.
  #
  # It replaces a hard cap backed by validation_carbon_slack_dollars, where
  # exceeding the target cost a DIMENSIONLESS slack scaled by a big-M -- so the
  # implied price per tonne moved with that bound rather than with anything real.
  # The consequence was measurable: storage value jumped from 82,652 at
  # dc_carbon_cap 0.30 to 7,238,309 at 0.22, essentially all of it avoided
  # penalty, with no cap in between where the target binds and compliance is
  # still reachable. Pricing the excess directly removes the cliff -- 81,407 ->
  # 95,099 -> 143,448 -> 162,398 across the same caps -- and gives the number
  # physical units, because storage now trades off against a real cost per tonne
  # instead of against an arbitrage of the big-M.
  carbon_price_dollars_per_t: 185.0

# Keep the T2 checkpoints and evaluation reports separate from K3T1.
output_dir: outputs/generator_comparison_k1t2_48h
