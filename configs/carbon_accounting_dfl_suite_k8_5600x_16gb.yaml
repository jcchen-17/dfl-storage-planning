# End-to-end DFL comparison of carbon accounting and cap scope.
# All four variants start from the same pretrained CVAE, then independently
# fine-tune Full DFL K=8 under their own planning oracle.
base_config: configs/dataset_v2_dfl_hourly_layered_k8_reliability_cpu14600_32gb.yaml
pretrained_artifacts: outputs/k_sensitivity/k8
output_dir: outputs/ablations/carbon_accounting_dfl_k8_5600x_16gb/main_seed20260808

compute:
  solver_workers: 2
  solver_threads: 3
  solver_memory_limit_mb: 4500

evaluation:
  test_scenarios: 182
  carbon_formulation: layered_pcc
  carbon_cap_scope: hourly
  include_no_storage_reference: true
  violation_tolerance_t_per_hour: 1.0e-8

variants:
  - id: layered_hourly
    label: Layered-Hourly
    carbon_formulation: layered_pcc
    carbon_cap_scope: hourly
  - id: layered_horizon
    label: Layered-Horizon
    carbon_formulation: layered_pcc
    carbon_cap_scope: horizon
  - id: average_hourly
    label: Mixed-Hourly
    carbon_formulation: average_pcc
    carbon_cap_scope: hourly
  - id: average_horizon
    label: Mixed-Horizon
    carbon_formulation: average_pcc
    carbon_cap_scope: horizon
