# Fast planning-only sensitivity at a moderately relaxed carbon-intensity cap.
# The two formulations use the same learned K=8 support and the same 20-scenario
# common test set, evaluated under the strict Layered-Hourly accounting model.
base_config: configs/dataset_v2_dfl_hourly_layered_k8_reliability_cpu14600_32gb.yaml

output_dir: outputs/ablations/carbon_accounting_hourly_cap030_penalty1000_k8_5600x_16gb
test_scenarios: 20

costs:
  carbon_excess_dollars_per_t: 1000.0

planning:
  dc_carbon_cap: 0.30

compute:
  solver_workers: 4
  solver_threads: 2
  solver_memory_limit_mb: 2800

common_evaluation:
  carbon_formulation: layered_pcc
  carbon_cap_scope: hourly
  include_no_storage_reference: true
  violation_tolerance_t_per_hour: 1.0e-8

variants:
  - id: layered_hourly
    label: Layered-Hourly
    carbon_formulation: layered_pcc
    carbon_cap_scope: hourly
  - id: average_hourly
    label: Mixed-Hourly
    carbon_formulation: average_pcc
    carbon_cap_scope: hourly
