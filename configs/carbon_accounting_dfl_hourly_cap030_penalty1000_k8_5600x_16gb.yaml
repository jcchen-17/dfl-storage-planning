# End-to-end hourly DFL comparison at the calibrated carbon setting.
# Both variants start from the exact same pretrained CVAE and independently
# fine-tune Full DFL K=8 under their own carbon-accounting oracle.
base_config: configs/dataset_v2_dfl_hourly_layered_k8_reliability_cpu14600_32gb.yaml
pretrained_artifacts: outputs/k_sensitivity/k8
output_dir: outputs/ablations/carbon_accounting_dfl_hourly_cap030_penalty1000_k8_5600x_16gb/main_seed20260808

costs:
  carbon_excess_dollars_per_t: 1000.0

planning:
  dc_carbon_cap: 0.30

compute:
  solver_workers: 2
  solver_threads: 3
  solver_memory_limit_mb: 4500

evaluation:
  test_scenarios: 50
  carbon_formulation: layered_pcc
  carbon_cap_scope: hourly
  include_no_storage_reference: true
  violation_tolerance_t_per_hour: 1.0e-8

variants:
  - id: layered_hourly
    label: Layered-Hourly
    carbon_formulation: layered_pcc
    carbon_cap_scope: hourly
  - id: average_hourly
    label: Mixed-Hourly
    carbon_formulation: average_pcc
    carbon_cap_scope: hourly
