# Random-initialisation ablation for the dataset-v2 CVAE + REINFORCE run.
# Physical, economic and solver settings match the KMeans-initialised main run;
# only the DFL exploration schedule and output directory differ.
seed: 20260808

data:
  dataset_path: data/processed/ieee13_smartds_dfl_v2/dfl_scenarios_v2_48h.npz
  train_split: train
  validation_split: validation
  test_split: test
  horizon: 48
  delta_t_hours: 1.0
  deterministic_price: true
  tariff_spread_scale: 1.25
  tariff_reference_price_per_mwh: 53.248

cvae:
  latent_dim: 16
  hidden_dim: 256
  epochs: 300
  learning_rate: 0.001
  beta: 0.01
  ramp_weight: 0.10
  batch_size: 32
  kl_warmup_epochs: 40
  active_load_weight: 0.25
  reactive_load_weight: 0.10
  pv_weight: 0.20
  workload_weight: 0.0
  pue_weight: 0.05
  price_weight: 0.0
  carbon_weight: 0.30
  net_load_weight: 0.20
  net_peak_weight: 0.20
  price_spread_weight: 0.0
  carbon_spread_weight: 0.50

generator:
  kind: cvae

dfl:
  method: reinforce
  num_support_scenarios: 1
  # Ablation: start from a random observed support and explore a wider latent
  # neighbourhood. This tests whether REINFORCE can recover the same decision
  # region without receiving the strong KMeans medoid as its initial policy.
  epochs: 25
  policy_samples_per_epoch: 4
  validation_batch_size: 4
  final_validation_size: 4
  learning_rate: 0.01
  baseline_momentum: 0.75
  initial_exploration_std: 0.30
  minimum_exploration_std: 0.08
  exploration_decay: 0.97
  diversity_margin: 0.8
  diversity_weight: 0.0
  weight_entropy_weight: 0.0
  latent_prior_weight: 0.001
  support_init_rule: random
  training_relative_gap: 0.02
  validation_relative_gap: 0.04
  training_allow_carbon_slack: true
  decision_deadband_relative: 0.001
  reinforce_finalists: 4
  early_stopping_patience: 10
  early_stopping_min_epochs: 15
  evaluation_selection_rule: kmeans
  device: auto

data_center:
  non_it_mw: 0.09
  it_base_mw: 0.36
  it_workload_mw: 0.90
  workload_max_delay_hours: 0
  workload_processing_upper: 1.20

planning:
  max_storage_sites: 1
  enumerate_storage_sites: true
  enumeration_site_time_limit_seconds: 60
  enumeration_absolute_gap_dollars: 100
  initial_soc: 0.20
  initial_carbon_intensity: 0.28
  min_soc: 0.10
  max_soc: 0.90
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  self_discharge: 0.0
  min_power_mw: 0.05
  max_power_mw: 4.00
  min_energy_mwh: 0.10
  max_energy_mwh: 24.00
  min_duration_hours: 1.0
  max_duration_hours: 8.0
  grid_limit_mw: 5.0
  backup_generator_mw: 2.0
  backup_generator_mvar: 1.6
  carbon_intensity_max: 0.75
  dc_carbon_cap: 0.28
  other_bus_carbon_cap: 1.10
  carbon_formulation: layered_dc_exact
  storage_service_mode: shared_feeder
  carbon_cap_scope: hourly
  carbon_envelope_bound: demand
  flow_limit_formulation: polygon
  solver_time_limit_seconds: 180
  solver_backend: gurobi
  solver_relative_gap: 0.01
  solver_threads: 2
  solver_emphasis: feasibility
  solver_aggressive_heuristics: true
  solver_max_parallel_workers: 4
  solver_memory_limit_mb: 5500
  verbose_solver: false
  warm_start_time_limit_seconds: 30

costs:
  capital_recovery_factor: 0.09
  site_dollars: 20000.0
  power_dollars_per_mw: 140000.0
  energy_dollars_per_mwh: 135000.0
  degradation_dollars_per_mwh: 7.0
  demand_dollars_per_mw_year: 160000.0
  generator_dollars_per_mwh: 250.0
  delay_dollars_per_task_hour: 24.0
  curtailment_dollars_per_mwh: 4.0
  shedding_dollars_per_mwh: 10000.0
  validation_carbon_slack_dollars: 300000.0
  carbon_price_dollars_per_t: 200.0

output_dir: outputs/dataset_v2_dfl_hourly_layered_tou125_carbon200_random_init
