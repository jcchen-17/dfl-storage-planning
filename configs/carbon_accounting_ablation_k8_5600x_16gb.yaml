# Carbon-accounting/cap-scope ablation for a Ryzen 5 5600X and 16 GB RAM.
# Scientific parameters inherit the reliability-calibrated K=8 case; only
# local solver concurrency, memory ceilings, and the artifact namespace differ.
base_config: configs/dataset_v2_dfl_hourly_layered_k8_reliability_cpu14600_32gb.yaml

output_dir: outputs/ablations/carbon_accounting_k8_5600x_16gb
test_scenarios: 182

compute:
  solver_workers: 2
  solver_threads: 3
  solver_memory_limit_mb: 4500

common_evaluation:
  carbon_formulation: layered_pcc
  carbon_cap_scope: hourly
  include_no_storage_reference: true
  violation_tolerance_t_per_hour: 1.0e-8

variants:
  - id: layered_hourly
    label: Layered-Hourly
    carbon_formulation: layered_pcc
    carbon_cap_scope: hourly
  - id: layered_horizon
    label: Layered-Horizon
    carbon_formulation: layered_pcc
    carbon_cap_scope: horizon
  - id: average_hourly
    label: Mixed-Hourly
    carbon_formulation: average_pcc
    carbon_cap_scope: hourly
  - id: average_horizon
    label: Mixed-Horizon
    carbon_formulation: average_pcc
    carbon_cap_scope: horizon
