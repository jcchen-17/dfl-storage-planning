# Reliability-calibrated K=8 main experiment.
#
# This configuration preserves the physical system and carbon requirement of
# dataset_v2_dfl_hourly_layered_k8.yaml, but prevents small amounts of outage
# shedding from being used as a cheap substitute for storage investment.
seed: 20260808

data:
  dataset_path: data/processed/ieee13_smartds_dfl_v2_outage/dfl_scenarios_v2_48h.npz
  train_split: train
  validation_split: validation
  test_split: test
  horizon: 48
  delta_t_hours: 1.0
  deterministic_price: true
  tariff_spread_scale: 1.25
  tariff_reference_price_per_mwh: 53.248
  pcc_source_bus: "675"
  pcc_pv_capacity_mw: 5.0

cvae:
  latent_dim: 16
  hidden_dim: 256
  epochs: 300
  learning_rate: 0.001
  beta: 0.01
  ramp_weight: 0.10
  batch_size: 32
  kl_warmup_epochs: 40
  active_load_weight: 0.25
  reactive_load_weight: 0.0
  pv_weight: 0.20
  workload_weight: 0.0
  pue_weight: 0.05
  price_weight: 0.0
  carbon_weight: 0.30
  net_load_weight: 0.20
  net_peak_weight: 0.20
  price_spread_weight: 0.0
  carbon_spread_weight: 0.50

generator:
  kind: cvae

dfl:
  method: recourse_feasibility
  initialize_from_pretrained: true
  num_support_scenarios: 8
  epochs: 45

  # Use twice as many fixed validation scenarios for less noisy checkpoint
  # selection. Evaluating every second epoch keeps the validation workload
  # approximately equal to the original 16-scenario/every-epoch setting.
  final_validation_size: 32
  validation_interval: 2
  training_relative_gap: 0.01
  training_allow_carbon_slack: true
  evaluation_selection_rule: kmeans

  # A value of 1e-4 treated roughly 7.4 MWh/yr as "reliable" at the present
  # annual demand. The tighter tolerance targets about 0.074 MWh/yr before a
  # checkpoint is allowed to compete on carbon and regret.
  checkpoint_selection: carbon_first
  checkpoint_shedding_tolerance: 0.000001
  checkpoint_carbon_tolerance: 0.0

  device: auto
  lambda_dfl: 1.0

  # Load underestimation and PV overestimation are the two optimistic errors
  # that cause outage shedding. Strengthen both while retaining a substantial
  # carbon signal for the carbon-aware planning objective.
  feasibility_load_weight: 2.0
  feasibility_pv_weight: 2.0
  feasibility_carbon_weight: 1.5
  dfl_start_epoch: 0
  dfl_eval_interval: 1
  decision_batch_size: 8
  fixed_decision_anchors: true
  use_solution_cache: true

  # The baseline runner overrides alpha to 1/0 for IPL-only/OPL-only and keeps
  # alpha=0.5 for Full DFL, producing the intended reliability/economic
  # ablation without changing the common physical objective.
  infeasibility_aversion_alpha: 0.5
  feasibility_margin: 0.075
  reconstruction_batch_size: 32
  dfl_statistical_weight: 0.15
  gradient_balance_ratio: 0.15
  gradient_balance_min_scale: 1.0
  gradient_balance_max_scale: 1000.0

data_center:
  non_it_mw: 0.75
  it_base_mw: 5.0
  it_workload_mw: 3.75
  workload_max_delay_hours: 0
  workload_processing_upper: 1.20

planning:
  topology: single_pcc
  max_storage_sites: 1
  enumerate_storage_sites: false
  initial_soc: 0.50
  initial_carbon_intensity: 0.28
  min_soc: 0.10
  max_soc: 0.90
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  self_discharge: 0.0
  min_power_mw: 0.20
  max_power_mw: 7.50
  min_energy_mwh: 0.50
  max_energy_mwh: 60.00
  min_duration_hours: 1.0
  max_duration_hours: 8.0
  grid_limit_mw: 15.00
  backup_generator_mw: 6.00
  backup_generator_mvar: 0.0
  carbon_intensity_max: 0.75
  dc_carbon_cap: 0.28
  other_bus_carbon_cap: 1.10
  carbon_formulation: layered_pcc
  diesel_carbon_t_per_mwh: 0.66
  outage_carbon_cap: 0.66
  allow_grid_connected_shedding: false
  storage_service_mode: shared_feeder
  carbon_cap_scope: hourly
  carbon_envelope_bound: demand
  flow_limit_formulation: polygon

  # Longer solves reduce the number of provisional time-limited incumbents in
  # the final comparison. Parallel suite runners may still lower worker counts.
  solver_time_limit_seconds: 300
  solver_backend: gurobi
  solver_relative_gap: 0.001
  solver_threads: 4
  solver_emphasis: feasibility
  solver_aggressive_heuristics: true
  solver_max_parallel_workers: 6
  solver_memory_limit_mb: 5500
  verbose_solver: false

costs:
  capital_recovery_factor: 0.09
  site_dollars: 20000.0
  power_dollars_per_mw: 140000.0
  energy_dollars_per_mwh: 135000.0
  degradation_dollars_per_mwh: 7.0
  demand_dollars_per_mw_year: 160000.0
  generator_dollars_per_mwh: 250.0
  curtailment_dollars_per_mwh: 4.0

  # Reliability calibration: at 50,000 $/MWh, the observed 1.328 MWh/yr
  # CVAE-to-Full shedding gap is worth about $66,400/yr instead of $13,300/yr.
  # This makes reliability material without turning shedding into a hard
  # constraint that would collapse all methods to the same maximum design.
  shedding_dollars_per_mwh: 50000.0

  # Retain the original carbon-compliance price so the experiment remains
  # carbon-aware; reliability is rebalanced by raising VOLL, not by weakening
  # the operational carbon requirement.
  carbon_excess_dollars_per_t: 500.0

# Keep all artifacts separate from the completed K-sensitivity experiment.
output_dir: outputs/reliability_calibration/k8_voll50k
