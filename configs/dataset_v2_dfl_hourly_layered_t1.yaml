# Main single-PCC data-centre microgrid experiment. The historical load and PV
# at IEEE-13 bus 675 are retained; all other feeder nodes are discarded.
seed: 20260808

data:
  dataset_path: data/processed/ieee13_smartds_dfl_v2_outage/dfl_scenarios_v2_48h.npz
  train_split: train
  validation_split: validation
  test_split: test
  horizon: 48
  delta_t_hours: 1.0
  # OpenEI OPT-V is a known calendar tariff, not a stochastic market-price
  # trajectory. The codec restores a legal tariff template after every decode.
  deterministic_price: true
  # Enhanced-TOU sensitivity: widen the published OPT-V peak/valley deviations
  # by 25% around its shoulder rate while retaining the legal calendar schedule.
  tariff_spread_scale: 1.25
  tariff_reference_price_per_mwh: 53.248
  # Bus 675 supplies only the co-located PV trace. PCC demand is synthesized
  # from workload/PUE and is not an aggregation of IEEE-13 demand.
  pcc_source_bus: "675"
  # Preserve the three-year bus-675 solar shape but normalize its original
  # 0.65 MW nameplate trajectory to a 5 MW behind-the-meter installation.
  pcc_pv_capacity_mw: 5.0

cvae:
  # Sixteen dimensions provide a compact conditional scenario manifold.
  latent_dim: 16
  hidden_dim: 256
  epochs: 300
  learning_rate: 0.001
  beta: 0.01
  ramp_weight: 0.10
  batch_size: 32
  kl_warmup_epochs: 40
  active_load_weight: 0.25
  reactive_load_weight: 0.0
  pv_weight: 0.20
  # Workload is restored from the fixed v2 template by ScenarioCodec v5.
  workload_weight: 0.0
  pue_weight: 0.05
  # Price is restored deterministically from the calendar-conditioned tariff.
  price_weight: 0.0
  carbon_weight: 0.30
  net_load_weight: 0.20
  net_peak_weight: 0.20
  price_spread_weight: 0.0
  carbon_spread_weight: 0.50

generator:
  kind: cvae

dfl:
  # Load a separately pretrained CVAE checkpoint, then decision-focus it.
  method: recourse_feasibility
  initialize_from_pretrained: true
  num_support_scenarios: 8
  epochs: 45
  final_validation_size: 16
  training_relative_gap: 0.01
  # Soft constraint during DFL/validation: excess average emissions remain
  # feasible but pay the configured high carbon-excess penalty.
  training_allow_carbon_slack: true
  evaluation_selection_rule: kmeans
  # Reliability is a guardrail; among reliable checkpoints, carbon performance
  # is the primary research objective and economic regret breaks ties.
  checkpoint_selection: carbon_first
  checkpoint_shedding_tolerance: 0.0001
  device: auto
  lambda_dfl: 1.0
  feasibility_load_weight: 1.0
  feasibility_pv_weight: 1.0
  # Hourly carbon constraints yield one slack signal per interval, so use a
  # moderate carbon weight and allow the random CVAE to learn basic trajectories
  # before decision feedback begins.
  feasibility_carbon_weight: 2.0
  dfl_start_epoch: 0
  dfl_eval_interval: 1
  # Stable-anchor mode uses the final eight supports directly. This value is
  # retained as the fallback batch size when fixed_decision_anchors is false.
  decision_batch_size: 8
  # Train on the exact scenario indices, conditions, latent draws and weights
  # used by checkpoint validation and final planning.
  fixed_decision_anchors: true
  use_solution_cache: true
  # Odece-style balance: IPL avoids optimistic/infeasible supports; OPL avoids
  # over-conservative supports that exclude the real optimal design.
  infeasibility_aversion_alpha: 0.5
  feasibility_margin: 0.05
  # Reconstruction and decision supervision use independent batches.
  reconstruction_batch_size: 32
  # After the ten-epoch warm-up, keep reconstruction as a regularizer while
  # allowing the stable decision signal to shape the decoder.
  dfl_statistical_weight: 0.20
  # The held-out validation bag and latent supports stay fixed across epochs.
  validation_interval: 1
  # Balance gradients only in the decoder, the parameter subspace reached by
  # both reconstruction and decision feedback.
  gradient_balance_ratio: 0.10
  gradient_balance_min_scale: 1.0
  gradient_balance_max_scale: 1000.0

data_center:
  # Calibrated 10 MW-class facility: 7.463-10.224 MW across all three splits,
  # 8.477 MW mean, 9.416 MW p95, and CV=0.070. This preserves the three-year
  # workload/PUE construction; it is not a metered facility trace.
  non_it_mw: 0.75
  it_base_mw: 5.0
  it_workload_mw: 3.75
  # Computing demand is inflexible so workload shifting cannot substitute for
  # carbon-aware storage.
  workload_max_delay_hours: 0
  workload_processing_upper: 1.20

planning:
  topology: single_pcc
  max_storage_sites: 1
  # There is one behind-the-meter storage location, so no siting enumeration.
  enumerate_storage_sites: false
  initial_soc: 0.50
  initial_carbon_intensity: 0.28
  min_soc: 0.10
  max_soc: 0.90
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  self_discharge: 0.0
  min_power_mw: 0.20
  # Across train/validation/test, a 3.5 MW GT leaves at most 5.817 MW of
  # instantaneous unmet outage demand.
  max_power_mw: 7.50
  min_energy_mwh: 0.50
  # Worst four-hour outage residual is 20.325 MWh. Starting at 50% SOC with a
  # 10% floor and 95% discharge efficiency requires 53.49 MWh; 60 MWh includes
  # a modest physical margin.
  max_energy_mwh: 60.00
  min_duration_hours: 1.0
  max_duration_hours: 8.0
  grid_limit_mw: 15.00
  # Partial firm backup: enough to serve most IT load, but not every coincident
  # high-load/low-PV outage hour. This makes storage reliability observable.
  # Three modular 2 MW backup generators; the PCC model dispatches their
  # combined 6 MW rating.
  backup_generator_mw: 6.00
  backup_generator_mvar: 0.0
  carbon_intensity_max: 0.75
  dc_carbon_cap: 0.28
  other_bus_carbon_cap: 1.10
  # Exact, linear source/vintage ledger at the PCC: initial inventory, PV and
  # diesel layers, plus one grid-carbon layer per charging interval.
  carbon_formulation: layered_pcc
  diesel_carbon_t_per_mwh: 0.66
  # Emergency energy receives the diesel-intensity allowance. Grid-connected
  # intervals retain dc_carbon_cap=0.30 in the same 48 h weighted budget.
  outage_carbon_cap: 0.66
  # Shedding is a reliability action available only during a grid outage.
  allow_grid_connected_shedding: false
  # Retained for configuration compatibility; topology=single_pcc has only the
  # behind-the-meter storage service boundary.
  storage_service_mode: shared_feeder
  # Apply dc_carbon_cap to the load-weighted average over each 48 h scenario,
  # rather than requiring every individual hour to remain below the cap.
  carbon_cap_scope: hourly
  carbon_envelope_bound: demand
  flow_limit_formulation: polygon
  solver_time_limit_seconds: 180
  solver_backend: gurobi
  solver_relative_gap: 0.001
  # Four independent DFL candidates can run concurrently.
  solver_threads: 4
  solver_emphasis: feasibility
  solver_aggressive_heuristics: true
  # Each PCC model is linear apart from operating/build binaries; this is a
  # conservative per-worker ceiling rather than a measured requirement.
  solver_max_parallel_workers: 6
  solver_memory_limit_mb: 5500
  verbose_solver: false

costs:
  capital_recovery_factor: 0.09
  site_dollars: 20000.0
  power_dollars_per_mw: 140000.0
  energy_dollars_per_mwh: 135000.0
  degradation_dollars_per_mwh: 7.0
  demand_dollars_per_mw_year: 160000.0
  generator_dollars_per_mwh: 250.0
  curtailment_dollars_per_mwh: 4.0
  shedding_dollars_per_mwh: 10000.0
  # Economic penalty for exceeding the mixed normal/outage horizon budget.
  # Physical excess remains feasible and is reported explicitly.
  carbon_excess_dollars_per_t: 500.0

# New physical scaling invalidates the old normalization and CVAE checkpoint;
# use a clean artifact namespace so stale feeder-aggregate models cannot load.
output_dir: outputs/hourly_layered/t1
