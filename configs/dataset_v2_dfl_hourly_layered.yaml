# Main single-PCC data-centre microgrid experiment. Historical IEEE-13 profiles
# are aggregated at load time; the feeder model is retained only in legacy
# configurations and dataset construction.
seed: 20260808

data:
  dataset_path: data/processed/ieee13_smartds_dfl_v2_outage/dfl_scenarios_v2_48h.npz
  train_split: train
  validation_split: validation
  test_split: test
  horizon: 48
  delta_t_hours: 1.0
  # OpenEI OPT-V is a known calendar tariff, not a stochastic market-price
  # trajectory. The codec restores a legal tariff template after every decode.
  deterministic_price: true
  # Enhanced-TOU sensitivity: widen the published OPT-V peak/valley deviations
  # by 25% around its shoulder rate while retaining the legal calendar schedule.
  tariff_spread_scale: 1.25
  tariff_reference_price_per_mwh: 53.248

cvae:
  # Sixteen dimensions provide a compact conditional scenario manifold.
  latent_dim: 16
  hidden_dim: 256
  epochs: 300
  learning_rate: 0.001
  beta: 0.01
  ramp_weight: 0.10
  batch_size: 32
  kl_warmup_epochs: 40
  active_load_weight: 0.25
  reactive_load_weight: 0.0
  pv_weight: 0.20
  # Workload is restored from the fixed v2 template by ScenarioCodec v5.
  workload_weight: 0.0
  pue_weight: 0.05
  # Price is restored deterministically from the calendar-conditioned tariff.
  price_weight: 0.0
  carbon_weight: 0.30
  net_load_weight: 0.20
  net_peak_weight: 0.20
  price_spread_weight: 0.0
  carbon_spread_weight: 0.50

generator:
  kind: cvae

dfl:
  # Directly fine-tune the CVAE with exact fixed-design recourse feedback.
  method: recourse_feasibility
  num_support_scenarios: 4
  epochs: 15
  final_validation_size: 4
  training_relative_gap: 0.005
  training_allow_carbon_slack: true
  evaluation_selection_rule: kmeans
  device: auto
  lambda_dfl: 1.0
  feasibility_load_weight: 1.0
  feasibility_pv_weight: 1.0
  feasibility_carbon_weight: 1.0
  dfl_start_epoch: 0
  dfl_eval_interval: 1
  decision_batch_size: 4
  use_solution_cache: true

data_center:
  non_it_mw: 0.09
  it_base_mw: 0.36
  it_workload_mw: 0.90
  # Computing demand is inflexible so workload shifting cannot substitute for
  # carbon-aware storage.
  workload_max_delay_hours: 0
  workload_processing_upper: 1.20

planning:
  topology: single_pcc
  max_storage_sites: 1
  # There is one behind-the-meter storage location, so no siting enumeration.
  enumerate_storage_sites: false
  initial_soc: 0.20
  initial_carbon_intensity: 0.28
  min_soc: 0.10
  max_soc: 0.90
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  self_discharge: 0.0
  min_power_mw: 0.05
  max_power_mw: 4.00
  min_energy_mwh: 0.10
  max_energy_mwh: 24.00
  min_duration_hours: 1.0
  max_duration_hours: 8.0
  grid_limit_mw: 5.0
  # Partial firm backup: enough to serve most IT load, but not every coincident
  # high-load/low-PV outage hour. This makes storage reliability observable.
  backup_generator_mw: 0.75
  backup_generator_mvar: 1.6
  carbon_intensity_max: 0.75
  dc_carbon_cap: 0.28
  other_bus_carbon_cap: 1.10
  # Exact, linear source/vintage ledger at the PCC: initial inventory, PV and
  # diesel layers, plus one grid-carbon layer per charging interval.
  carbon_formulation: layered_pcc
  diesel_carbon_t_per_mwh: 0.72
  # Retained for configuration compatibility; topology=single_pcc has only the
  # behind-the-meter storage service boundary.
  storage_service_mode: shared_feeder
  carbon_cap_scope: hourly
  carbon_envelope_bound: demand
  flow_limit_formulation: polygon
  solver_time_limit_seconds: 180
  solver_backend: gurobi
  solver_relative_gap: 0.001
  # Four independent DFL candidates can run concurrently.
  solver_threads: 2
  solver_emphasis: feasibility
  solver_aggressive_heuristics: true
  # Each PCC model is linear apart from operating/build binaries; this is a
  # conservative per-worker ceiling rather than a measured requirement.
  solver_max_parallel_workers: 4
  solver_memory_limit_mb: 5500
  verbose_solver: false

costs:
  capital_recovery_factor: 0.09
  site_dollars: 20000.0
  power_dollars_per_mw: 140000.0
  energy_dollars_per_mwh: 135000.0
  degradation_dollars_per_mwh: 7.0
  demand_dollars_per_mw_year: 160000.0
  generator_dollars_per_mwh: 250.0
  curtailment_dollars_per_mwh: 4.0
  shedding_dollars_per_mwh: 10000.0
  # Diagnostic relaxation of the urgent hourly cap. The physical excess is
  # still reported, but is more expensive than shedding carbon-intensive load.
  carbon_excess_dollars_per_t: 300000.0

output_dir: outputs/dataset_v2_dfl_single_pcc_outage_hourly_cap
