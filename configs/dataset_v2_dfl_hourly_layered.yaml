# Exploratory dataset-v2 CVAE + REINFORCE run under the proposed hourly
# vintage-layered carbon accounting. This has its own output directory and does
# not overwrite the exhaustive or carbon-accounting baselines.
seed: 20260808

data:
  dataset_path: data/processed/ieee13_smartds_dfl_v2/dfl_scenarios_v2_48h.npz
  train_split: train
  validation_split: validation
  test_split: test
  horizon: 48
  delta_t_hours: 1.0

cvae:
  # Sixteen dimensions balance reconstruction capacity against the continuous
  # search dimension faced by the downstream REINFORCE policy.
  latent_dim: 16
  hidden_dim: 256
  epochs: 300
  learning_rate: 0.001
  beta: 0.01
  ramp_weight: 0.10
  batch_size: 32
  kl_warmup_epochs: 40
  active_load_weight: 0.25
  reactive_load_weight: 0.10
  pv_weight: 0.20
  # Workload is restored from the fixed v2 template by ScenarioCodec v5.
  workload_weight: 0.0
  pue_weight: 0.05
  price_weight: 0.20
  carbon_weight: 0.30
  net_load_weight: 0.20
  net_peak_weight: 0.20
  price_spread_weight: 0.50
  carbon_spread_weight: 0.50

generator:
  kind: cvae

dfl:
  method: reinforce
  num_support_scenarios: 1
  # First exact-COPF diagnostic run. Four candidates fill one four-worker wave;
  # validation is deliberately small because every additional scenario adds a
  # complete 48 h nonconvex feeder model.
  epochs: 8
  policy_samples_per_epoch: 4
  # Each candidate is dispatched on four validation scenarios as four separate
  # exact models, then costs are weighted. This gives distributional DFL reward
  # without constructing a memory-heavy joint nonconvex model.
  validation_batch_size: 4
  final_validation_size: 4
  learning_rate: 0.01
  baseline_momentum: 0.75
  # Exact COPF failed to find any incumbent for 3/4 samples at sigma=0.18-0.20.
  # Stay closer to the CVAE posterior manifold so the planning oracle receives
  # physically familiar scenarios while retaining enough variation for ranking.
  initial_exploration_std: 0.10
  minimum_exploration_std: 0.03
  exploration_decay: 0.95
  diversity_margin: 0.8
  diversity_weight: 0.0
  weight_entropy_weight: 0.0
  latent_prior_weight: 0.001
  support_init_rule: kmeans
  training_relative_gap: 0.02
  # Four-scenario exact reward evaluation contains a tail case that plateaus at
  # 3.4-4.0% after 180 s. Planning remains at 2%; only fixed-design reward
  # dispatches use a 5% epsilon-optimal certificate.
  validation_relative_gap: 0.05
  training_allow_carbon_slack: true
  decision_deadband_relative: 0.01
  reinforce_finalists: 4
  early_stopping_patience: 4
  early_stopping_min_epochs: 6
  evaluation_selection_rule: kmeans
  device: auto

data_center:
  non_it_mw: 0.09
  it_base_mw: 0.36
  it_workload_mw: 0.90
  # Main experiment treats computing demand as inflexible so workload shifting
  # cannot substitute for carbon-aware storage. Delay flexibility is retained
  # as an explicit ablation through run_baselines.py.
  workload_max_delay_hours: 0
  workload_processing_upper: 1.20

planning:
  max_storage_sites: 1
  initial_soc: 0.20
  initial_carbon_intensity: 0.28
  min_soc: 0.10
  max_soc: 0.90
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  self_discharge: 0.0
  min_power_mw: 0.05
  max_power_mw: 4.00
  min_energy_mwh: 0.10
  max_energy_mwh: 24.00
  min_duration_hours: 1.0
  max_duration_hours: 8.0
  grid_limit_mw: 5.0
  backup_generator_mw: 2.0
  backup_generator_mvar: 1.6
  carbon_intensity_max: 0.75
  dc_carbon_cap: 0.28
  other_bus_carbon_cap: 1.10
  # Tight carbon compliance is applied at the data-center bus (675). Storage
  # keeps independently dispatchable charge vintages and network carbon follows
  # the feeder flows; other buses retain the loose other_bus_carbon_cap.
  # Exact nodal carbon propagation and exact charge-vintage storage accounting.
  # Siting, power and energy capacity are jointly optimized over all candidates.
  carbon_formulation: layered_dc_exact
  storage_service_mode: shared_feeder
  carbon_cap_scope: hourly
  carbon_envelope_bound: demand
  flow_limit_formulation: polygon
  solver_time_limit_seconds: 180
  solver_backend: gurobi
  # Report fixed-design test dispatches once they are certified within 1%.
  # Training remains looser at dfl.training_relative_gap=2%.
  solver_relative_gap: 0.01
  # Two threads curb per-model branch-and-bound memory while four independent
  # candidates still run concurrently (8 solver threads in the planning wave).
  solver_threads: 2
  solver_emphasis: feasibility
  solver_aggressive_heuristics: true
  # Four exact nonconvex solves in parallel leave memory for Windows, PyTorch
  # and the parent process on the 32 GB machine.
  solver_max_parallel_workers: 4
  solver_memory_limit_mb: 5500
  verbose_solver: false
  warm_start_time_limit_seconds: 30

costs:
  capital_recovery_factor: 0.09
  site_dollars: 20000.0
  power_dollars_per_mw: 140000.0
  energy_dollars_per_mwh: 135000.0
  degradation_dollars_per_mwh: 7.0
  demand_dollars_per_mw_year: 160000.0
  generator_dollars_per_mwh: 250.0
  delay_dollars_per_task_hour: 24.0
  curtailment_dollars_per_mwh: 4.0
  shedding_dollars_per_mwh: 10000.0
  validation_carbon_slack_dollars: 300000.0
  carbon_price_dollars_per_t: 185.0

output_dir: outputs/dataset_v2_dfl_hourly_layered
