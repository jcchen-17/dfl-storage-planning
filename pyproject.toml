[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-dfl-demo"
version = "0.1.0"
description = "Decision-focused scenario construction for carbon-aware single-PCC storage planning"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "pyarrow>=19,<20",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "torch>=2.2",
  "tensorboard>=2.15",
  "PySCIPOpt>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
storage-dfl-demo = "storage_dfl.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
